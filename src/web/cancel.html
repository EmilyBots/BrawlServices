<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Payment Cancelled – Brawl Services™</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0d0d0d;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #1a1a1a;
      border: 1px solid #444;
      border-radius: 20px;
      padding: 48px 40px;
      max-width: 460px;
      width: 90%;
      text-align: center;
      box-shadow: 0 0 40px rgba(0,0,0,0.4);
    }
    .icon { font-size: 64px; margin-bottom: 20px; }
    h1 { font-size: 28px; color: #ED4245; margin-bottom: 12px; }
    p { color: #aaa; line-height: 1.6; margin-bottom: 8px; }
    .tip {
      background: #111;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 14px;
      margin: 20px 0;
      font-size: 14px;
      color: #888;
    }
    .close-tip { font-size: 13px; color: #555; margin-top: 24px; }
    .brand { margin-top: 28px; font-size: 13px; color: #444; }
    .brand span { color: #FFB800; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">❌</div>
    <h1>Payment Cancelled</h1>
    <p>You cancelled the PayPal payment. No charge was made.</p>
    <div class="tip">
      💡 Go back to Discord and click the <strong>PayPal</strong> button again when you're ready to pay.
    </div>
    <p>Your order is still saved — just complete payment to get started.</p>
    <p class="close-tip">You can close this tab and return to Discord.</p>
    <div class="brand">Powered by <span>Brawl Services™</span></div>
  </div>
</body>
</html>
